[project]
name = "tukit"
version = "0.1.0"
description = "Tukit: armado asistido de kits escolares. Monorepo con despliegue independiente."
requires-python = ">=3.12"
dependencies = []

# Espacio de trabajo de uv: cada servicio y cada libreria es un paquete propio,
# resueltos juntos con un solo uv.lock. Esto es lo que elimina el baile de subir
# una version y crear un tag cada vez que cambia algo compartido, que es el costo
# concreto que motivo el 
[tool.uv.workspace]
members = ["servicios/*", "libs/py/*"]
# `ingesta` sigue fuera porque todavia no tiene ni paquete ni pyproject.
# `gateway` entro al espacio de trabajo el dia que dejo de ser una carpeta
# vacia: ya tiene dependencias propias (fastapi, httpx) y `make preparar`
# tiene que instalarlas, porque sin ellas el backend no levanta entero.
exclude = ["servicios/ingesta"]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    # Medir cobertura por servicio (`--cov=tukit_<svc>`); sin umbral de falla.
    "pytest-cov>=5.0",
    "ruff>=0.6",
    # Estos dos son extras opcionales de `tukit-comun` (ver su pyproject), pero
    # en desarrollo se quieren siempre: sin ellos `make bd-migrar` falla justo
    # despues de `make preparar`, y el mensaje habla de un modulo que falta en
    # vez de decir que hay que instalar un extra.
    #
    # Ponerlos aqui no engorda la integracion continua: sus trabajos instalan a
    # mano lo que cada uno necesita y no pasan por este grupo.
    "alembic>=1.13",
    "asyncpg>=0.29",
    # SQLAlchemy async lo necesita en tiempo de ejecucion (`engine.dispose`,
    # cualquier `await` contra el motor), pero no lo declara como dependencia
    # dura: su wheel lo trae solo bajo ciertos marcadores de plataforma. En este
    # entorno `uv sync` lo desinstalaba, y entonces `bd-completar`/`bd-volcar`
    # -todo lo que toca la BD async- moria con "the greenlet library is
    # required". Fijarlo aqui lo mantiene puesto entre `uv sync`.
    "greenlet>=3.0",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
# `arquitectura/` primero a proposito: si una frontera se rompio, se sabe antes
# de correr media hora de pruebas de dominio.
testpaths = ["arquitectura", "libs", "servicios", "ensayos"]
asyncio_mode = "auto"
# Cada servicio es un paquete raiz propio. Esto es lo que permite correr toda
# la suite desde aqui sin instalar nada, y a la vez mantiene los paquetes
# separados: `tukit_identidad` no queda dentro de `tukit_catalogo`.
pythonpath = [
    "arquitectura",
    "servicios/identidad",
    "servicios/catalogo",
    "servicios/inteligencia",
    "servicios/comercio",
    "servicios/operacion",
    "servicios/gateway",
    "libs/py/tukit_comun",
]
filterwarnings = ["error::DeprecationWarning"]
# Las pruebas contra un RabbitMQ de verdad y contra un Redis de verdad
#. Se saltan solas si no hay broker en `TUKIT_PRUEBAS_RABBITMQ_URL` (por
# omision, el local de `.env.ejemplo`) o Redis en `TUKIT_PRUEBAS_REDIS_URL` (por
# omision, la base 15 del local).
markers = [
    "rabbitmq: pruebas contra un RabbitMQ de verdad; se saltan si no hay broker",
    "redis: pruebas contra un Redis de verdad; se saltan si no hay Redis",
    "nl2c_vivo: ensayos del asistente NL2C contra Gemini de verdad; opt-in con -m nl2c_vivo",
]

[tool.mypy]
# Tipos incrementales: laxo global para no exigir anotar 40k lineas de
# golpe, ESTRICTO en el codigo nuevo puro (`tukit_comun.*` y los `dominio/`), que es
# donde vive la logica que un tipo mal puesto rompe callado. El circulo estricto
# se ensancha con el tiempo; hoy arranca verde, que es la regla.
python_version = "3.12"
ignore_missing_imports = true
strict = false

[[tool.mypy.overrides]]
module = ["tukit_comun.*"]
strict = true

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".claude/worktrees", ".worktrees"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# `Depends(...)` en un default de argumento es EL idiom de FastAPI, no el bug que
# B008 persigue (un default mutable evaluado una vez). Se marca como llamada
# inmutable para que el patron de inyeccion (`repo_dep`) no dispare B008.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
# Las revisiones de Alembic las escribe el autogenerador, no una persona:
# emite un `sa.Column(...)` por linea y muchas pasan de 110 caracteres. Se
# revisan leyendo el SQL que producen, no su formato. Reformatearlas a mano
# ademas haria ruidoso el diff de la siguiente regeneracion.
#
# Solo se perdona el ancho. El resto de reglas siguen activas, que es lo que
# atrapa un import que sobra o una revision que quedo sin `down_revision`.
"servicios/*/migraciones/versions/*.py" = ["E501"]

# Mismo argumento que las revisiones, aplicado a una tabla de datos. Los roles y
# los permisos son filas, y un registro por linea se revisa leyendo la tabla; la
# version envuelta en seis lineas por diccionario esconde la tabla detras del
# formato. Solo se perdona el ancho.
"servicios/identidad/tukit_identidad/sembrar_acceso.py" = ["E501"]
