[project]
name = "tukit-identidad"
version = "0.1.0"
description = "Personas, tenencia y autorizacion. Frontera de cumplimiento de datos de menores."
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "pydantic>=2.9",
    "tukit-comun",
    # Windows no trae la base de zonas horarias que usa ZoneInfo.
    "tzdata; sys_platform == 'win32'",
    # La superficie minima de lectura (`tukit_identidad.api`): colegios, sedes
    # y grados para que el acudiente escoja, mas el registro del contacto que
    # convierte un correo en un identificador. Sin ese ultimo, el contrato no
    # se puede cumplir: el trabajo del pipeline referencia al acudiente por
    # identificador y nunca copiando su correo.
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[tool.uv.sources]
tukit-comun = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tukit_identidad"]
