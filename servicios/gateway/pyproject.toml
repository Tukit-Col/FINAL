[project]
name = "tukit-gateway"
version = "0.1.0"
description = "Puerta de enlace: ruteo por prefijo hacia catalogo, identidad e inteligencia. Sin dominio y sin base."
requires-python = ">=3.12"
dependencies = ["fastapi>=0.165.0", "uvicorn[standard]>=0.54.0", "httpx>=0.27", "tukit-comun"]

[tool.uv.sources]
tukit-comun = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tukit_gateway"]
