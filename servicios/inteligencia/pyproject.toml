[project]
name = "tukit-inteligencia"
version = "0.1.0"
description = "Pipeline de lista escolar: percepcion, parseo, resolucion y optimizacion."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "sqlalchemy>=2.1.9",
    "tukit-comun",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # El unico camino por el que este servicio ve el catalogo y la identidad.
    # No puede importar sus paquetes ni leer sus bases (invariantes 1 y 3),
    # asi que un cliente HTTP no es una comodidad: es la frontera.
    "httpx>=0.27",
    # OE4: el optimizador de la tesis. NSGA-II sobre pymoo produce el frente de
    # Pareto de verdad que sostiene los resultados de hipervolumen; la
    # heuristica de `elegir_por_perfil` fue el andamio para que el ciclo
    # corriera antes de tener el algoritmo (ver docstring del paquete optimizador/).
    # Es dependencia DURA: el modulo la importa arriba sin `try`, asi que si
    # falta el servicio no arranca. Antes degradaba a la heuristica cuando no
    # estaba, pero esa degradacion silenciosa servia kits que no eran los del
    # algoritmo sin avisar; preferimos fallar ruidoso en el arranque.
    "pymoo>=0.6",
]

[project.optional-dependencies]
# El render de PDF no hace falta para las pruebas: la percepcion recibe las
# paginas ya hechas. Quien corre `percibir` sobre un archivo lo instala.
pdf = ["pypdfium2>=4.30", "pillow>=13"]

[tool.uv.sources]
tukit-comun = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tukit_inteligencia"]
