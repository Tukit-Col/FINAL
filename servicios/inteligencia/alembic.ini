# Migraciones de Inteligencia.
#
# Cada servicio tiene su propio alembic.ini y su propia carpeta de revisiones,
# porque cada uno tiene su propia base y se despliega solo. Una historia
# compartida obligaria a desplegarlos juntos, que es justo lo que el reparto en
# cinco bases evita.
#
# No hay `sqlalchemy.url` aqui a proposito. La URL la arma `tukit_comun.config`
# desde el entorno, y escribirla en este fichero volveria a poner el nombre de
# una base en un archivo del servicio, que es lo que la regla 3 prohibe.

[alembic]
script_location = migraciones

# Se corre desde el directorio del servicio (lo hace `make bd-migrar`), asi que
# las rutas son relativas a el: el propio paquete y la libreria compartida.
prepend_sys_path = . ../../libs/py/tukit_comun

# Fecha delante para que `ls` muestre las revisiones en el orden en que
# ocurrieron. El identificador solo no dice nada sobre cuando paso que.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# UTC: una migracion generada en Bogota y otra en otro huso tienen que ordenarse
# igual para todo el mundo.
timezone = UTC

# Las revisiones salen del autogenerador sin pasar por el formateador, y el
# trabajo de formato de la integracion continua las rechazaria una por una.
# Este gancho las arregla en el momento de escribirlas, que es mejor que
# excluirlas: quedan igual que el resto del arbol y su diff no se ensucia de
# reacomodos la siguiente vez que se regeneren.
#
# El ancho de linea si se les perdona, en `per-file-ignores` del pyproject: el
# formateador no parte una cadena larga y esas lineas las escribio una maquina.
[post_write_hooks]
hooks = ordenar formatear

ordenar.type = exec
ordenar.executable = ../../.venv/bin/ruff
ordenar.options = check --fix --select I REVISION_SCRIPT_FILENAME

formatear.type = exec
formatear.executable = ../../.venv/bin/ruff
formatear.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
