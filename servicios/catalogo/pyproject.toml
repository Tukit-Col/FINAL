[project]
name = "tukit-catalogo"
version = "0.1.0"
description = "Servicio de Catalogo: conceptos, productos canonicos, ofertas, listas oficiales y ciclo editorial"
requires-python = ">=3.12"
dependencies = ["sqlalchemy>=2.0", "pydantic>=2.0", "pgvector>=0.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tukit_catalogo"]
