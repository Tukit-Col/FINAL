desde = "catalogo.version_vigente.colegio_id"
hacia = "identidad.colegio"
nota = "Que edicion usa hoy ese colegio para un area, un grado y un anio."

[[referencias_cruzadas]]
desde = "catalogo.propuesta_version.colegio_id"
hacia = "identidad.colegio"
nota = "A quien le llega la propuesta editorial y de quien es la ventana de decision."

[[referencias_cruzadas]]
desde = "catalogo.propuesta_version.resuelta_por"
hacia = "identidad.usuario"
nota = "Nulo solo si la propuesta se vencio, que es el unico desenlace sin persona detras."

