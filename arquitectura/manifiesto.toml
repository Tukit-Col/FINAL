"""
tablas = []


# Referencias entre bases distintas. Como no pueden ser llaves foraneas fisicas,
# la unica forma de que no se vuelvan invisibles es declararlas. Toda referencia
# a un dominio ajeno que NO este aqui hace fallar la prueba.
#
# El diccionario de datos contabiliza 53. Se van declarando a medida que cada
# tabla se implementa; la prueba solo exige que lo implementado este declarado.
[[referencias_cruzadas]]
desde = "inteligencia.item_crudo.matricula_id"
hacia = "identidad.matricula"
nota = "Ancla de tenencia. Se valida contra Identidad al crear, no por llave foranea."

[[referencias_cruzadas]]
desde = "inteligencia.candidato_item.producto_canonico_id"
hacia = "catalogo.producto_canonico"
nota = "El catalogo vive en otra base; la referencia es logica."

[[referencias_cruzadas]]
