[servicios.gateway]
ruta = "servicios/gateway"
paquete = "tukit_gateway"
base_datos = ""
descripcion = """
Ruteo, validacion de token, version de permisos y limite de tasa. Sin dominio y sin base.
"""
tablas = []


# Lecturas cruzadas: los procesos que abren un motor a la base de otro servicio. Las tres
# drenan la bandeja de salida ajena y abren el motor con `url_desde_entorno`, que deriva el
# nombre de la base dentro de la libreria, asi que la regla 3 no las ve: por eso se declaran
# aqui.
#
# Son solo el respaldo sin broker. Con `RABBITMQ_URL`, cada proceso consume su cola (`cola`,
# declarada en `tukit_comun.topologia`) y no abre ningun motor ajeno. `modo = "sin_broker"` lo
# dice, y la prueba exige que toda llamada a `url_desde_entorno` de un servicio este en un modulo
# declarado aqui con ese modo y que desde `escuchar_cola` no se llegue a ninguna.
[[lecturas_cruzadas]]
modulo = "tukit_operacion.repartidor"
desde = "operacion"
hacia = ["comercio", "inteligencia"]
lee = "Las bandejas de comercio e inteligencia, y `trabajo_pipeline.usuario_id` para el destinatario de un `kits_publicados`."
modo = "sin_broker"
cola = "operacion.avisos"

[[lecturas_cruzadas]]
modulo = "tukit_identidad.poller"
desde = "identidad"
hacia = ["catalogo"]
lee = "`colegio_verificado` de la bandeja de catalogo."
modo = "sin_broker"
cola = "identidad.colegios"

[[lecturas_cruzadas]]
modulo = "tukit_inteligencia.poller"
desde = "inteligencia"
hacia = ["catalogo"]
lee = "`lista_verificada` y `lista_aprobada` de la bandeja de catalogo."
modo = "sin_broker"
cola = "inteligencia.listas"

# Referencias entre bases distintas. No pueden ser llaves foraneas fisicas, asi que la unica
# forma de que no se vuelvan invisibles es declararlas. Toda referencia a un dominio ajeno que no
# este aqui hace fallar la prueba.
[[referencias_cruzadas]]
desde = "inteligencia.item_crudo.matricula_id"
hacia = "identidad.matricula"
nota = "Ancla de tenencia. Se valida contra Identidad al crear, no por llave foranea."

[[referencias_cruzadas]]
desde = "inteligencia.candidato_item.producto_canonico_id"
hacia = "catalogo.producto_canonico"
nota = "El catalogo vive en otra base; la referencia es logica."

[[referencias_cruzadas]]
desde = "inteligencia.linea_kit.producto_canonico_id"
hacia = "catalogo.producto_canonico"
nota = "Reemplaza el JSON `kits_optimizados.items`, que escondia esta misma referencia."

[[referencias_cruzadas]]
desde = "inteligencia.resolucion_item.decidido_por"
hacia = "identidad.usuario"
nota = """
Quien de Admin Tukit valido el emparejamiento o lo marco sin coincidencia. Nulo mientras la
decision sea automatica: un kit revisado por una persona y uno que salio solo del umbral no
son la misma promesa.
"""

[[referencias_cruzadas]]
desde = "inteligencia.transicion_resolucion.decidida_por"
hacia = "identidad.usuario"
nota = "Quien movio la resolucion de un estado a otro. Nulo cuando la movio el pipeline."

[[referencias_cruzadas]]
desde = "inteligencia.trabajo_pipeline.revisado_por"
hacia = "identidad.usuario"
nota = """
Quien aprobo o devolvio el trabajo en la cola de revision. El registro
completo de la transicion va a `operacion.registro_auditoria` por la bandeja de
salida; esta columna es la copia local que permite responder
`GET /v1/admin/trabajos/{id}` sin depender de que Operacion este arriba.
"""

[[referencias_cruzadas]]
desde = "comercio.linea_pedido.matricula_id"
hacia = "identidad.matricula"
nota = "Va en la linea y no en el pedido: dos hermanos deben caber en un solo pago."

[[referencias_cruzadas]]
desde = "comercio.linea_pedido.producto_canonico_id"
hacia = "catalogo.producto_canonico"
nota = "El precio se congela en la linea al confirmar; no se vuelve a leer de Catalogo."

[[referencias_cruzadas]]
desde = "comercio.inventario.producto_canonico_id"
hacia = "catalogo.producto_canonico"
nota = "El stock es de Comercio; el producto es de Catalogo."

[[referencias_cruzadas]]
desde = "catalogo.lista_oficial.sede_id"
hacia = "identidad.sede"
nota = "La lista la publica un colegio, que vive en Identidad."

[[referencias_cruzadas]]
desde = "operacion.registro_auditoria.actor_id"
hacia = "identidad.usuario"
nota = "Auditoria referencia al actor sin poder bloquearlo ni borrarlo en cascada."

[[referencias_cruzadas]]
desde = "comercio.pedido.usuario_id"
hacia = "identidad.usuario"
nota = "Quien compra. La supresion del titular NO borra el pedido: obligacion contable."

[[referencias_cruzadas]]
desde = "comercio.historial_pedido.actor_id"
hacia = "identidad.usuario"
nota = "Quien del back-office movio el pedido de estado. Referencia logica: la supresion del operador no borra el historial."

[[referencias_cruzadas]]
desde = "comercio.devolucion.usuario_id"
hacia = "identidad.usuario"

[[referencias_cruzadas]]
desde = "comercio.reserva_inventario.producto_canonico_id"
hacia = "catalogo.producto_canonico"
nota = "La reserva es de Comercio; el producto es de Catalogo."

[[referencias_cruzadas]]
desde = "comercio.precio_proveedor.producto_canonico_id"
hacia = "catalogo.producto_canonico"
nota = """
El precio contractual que un mayorista le cobra a Tukit. NO se unifica con
`catalogo.precio_oferta`, que es el precio publico observado: son datos
distintos en lados opuestos de la asimetria de recuperacion. Uno se
reconstruye scrapeando y el otro no se puede perder.
"""

[[referencias_cruzadas]]
desde = "comercio.inventario_proveedor.producto_canonico_id"
hacia = "catalogo.producto_canonico"

[[referencias_cruzadas]]
desde = "comercio.item_pedido_mayorista.producto_canonico_id"
hacia = "catalogo.producto_canonico"

[[referencias_cruzadas]]
desde = "inteligencia.kit.matricula_id"
hacia = "identidad.matricula"
nota = "Un kit es para un estudiante en un grado y un anio, no para una cuenta."

[[referencias_cruzadas]]
desde = "inteligencia.trabajo_pipeline.usuario_id"
hacia = "identidad.usuario"
nota = """
Quien pidio el kit, y por tanto a quien hay que avisarle cuando termine. El
trabajo es por HOGAR y no por hijo: es lo que permite consolidar entre hermanos
y repartir empaques, cosa que no se puede ver si cada hijo se pide aparte.

Va por identificador y no copia correo ni celular, para que el derecho al olvido lo alcance.
"""

[[referencias_cruzadas]]
desde = "catalogo.configuracion_colegio_editorial.colegio_id"
hacia = "identidad.colegio"

[[referencias_cruzadas]]
desde = "catalogo.version_lista_oficial.sede_id"
hacia = "identidad.sede"

[[referencias_cruzadas]]
desde = "operacion.caso.usuario_id"
hacia = "identidad.usuario"
nota = "El titular del caso. Puede ser nulo cuando el caso lo abre el sistema."

[[referencias_cruzadas]]
desde = "operacion.notificacion.usuario_id"
hacia = "identidad.usuario"
nota = """
El destinatario. La referencia va por identificador y el contenido de la notificacion no repite
el dato de contacto, para que el derecho al olvido lo alcance.
"""

[[referencias_cruzadas]]
desde = "operacion.preferencia_notificacion.usuario_id"
hacia = "identidad.usuario"

[[referencias_cruzadas]]
desde = "operacion.evento_clickout.kit_id"
hacia = "inteligencia.kit"

[[referencias_cruzadas]]
desde = "operacion.evento_clickout.producto_canonico_id"
hacia = "catalogo.producto_canonico"

[[referencias_cruzadas]]
desde = "operacion.caso.trabajo_id"
hacia = "inteligencia.trabajo_pipeline"
nota = "De que trabajo del pipeline salio el caso. Nulo en un caso general que no viene de un trabajo."

[[referencias_cruzadas]]
desde = "operacion.caso.pedido_id"
hacia = "comercio.pedido"
nota = """
El pedido al que se refiere el caso (una incidencia de pago o de entrega). Nulo
cuando el caso no es sobre un pedido. Referencia logica: el pedido vive en la
base de Comercio y Operacion no puede imponerle una llave foranea.
"""

[[referencias_cruzadas]]
desde = "operacion.caso.asignado_a_id"
hacia = "identidad.usuario"
nota = """
El operador que gestiona el caso. Nulo mientras nadie lo toma. Se llama con
sufijo `_id` a proposito para que la prueba de fronteras lo detecte y exija esta
declaracion; si fuera `asignado_a` cruzaria a Identidad en silencio.
"""

# --- Comercio ---

[[referencias_cruzadas]]
desde = "comercio.pedido.trabajo_id"
hacia = "inteligencia.trabajo_pipeline"
nota = """
De que trabajo publicado del pipeline nacio el pedido, para cruzar el back-office
de logistica con la cola de revision. Nulo porque un pedido puede entrar por otra
via el dia que exista.
"""

# --- Catalogo ---

[[referencias_cruzadas]]
desde = "catalogo.producto_canonico.curado_por"
hacia = "identidad.usuario"
nota = "Un producto que nadie curo no existe, asi que no admite nulo pese a cruzar."

[[referencias_cruzadas]]
desde = "catalogo.sustituibilidad_concepto.curado_por"
hacia = "identidad.usuario"
nota = """
Quien declaro que un concepto sirve en lugar de otro. La relacion es curada y
no inducida, asi que saber quien la puso es lo que la distingue de un coseno
entre embeddings. No admite nulo, por la misma regla que
`producto_canonico.curado_por`. Los dos extremos de la arista SI son llaves
foraneas fisicas: ambos conceptos viven en esta misma base.
"""

[[referencias_cruzadas]]
desde = "catalogo.lista_oficial.colegio_id"
hacia = "identidad.colegio"
nota = "La lista oficial es vocabulario de catalogo; la tenencia del colegio vive en Identidad."

[[referencias_cruzadas]]
desde = "inteligencia.kit_canonico.colegio_id"
hacia = "identidad.colegio"
nota = """
El puntero a la cache de kits benditos se indexa por (colegio, grado, anio). El
colegio vive en Identidad; aqui es la llave con la que el acudiente elige su
grado en /empezar y con la que la ruta de aplicacion encuentra los kits ya
validados. La integridad se apoya en que el colegio ya existia cuando su lista
se importo (misma garantia que `catalogo.lista_oficial.colegio_id`)."""

[[referencias_cruzadas]]
desde = "inteligencia.importacion_lista.colegio_id"
hacia = "identidad.colegio"
nota = """
El destino de una lista que un acudiente subio y que espera a que el catalogo
vuelva. Es el mismo `colegio_id` que viaja a
`catalogo.tarea_importacion`: el de un aliado, o el derivado del DANE o del
nombre de un colegio que aun no existe y nace al aprobar. Referencia logica,
como la de la tarea: la tenencia del colegio vive en Identidad.
"""

[[referencias_cruzadas]]
desde = "catalogo.tarea_importacion.colegio_id"
hacia = "identidad.colegio"
nota = """
El destino declarado por quien importo una lista, redundante con la lista pero
util para diagnosticar una importacion que fallo ANTES de resolverla. Referencia
logica y nullable: una importacion mal formada puede no traer aun un colegio
valido. La tenencia del colegio vive en Identidad.
"""

[[referencias_cruzadas]]
desde = "catalogo.version_lista_oficial.revisada_por"
hacia = "identidad.usuario"
nota = """
Quien dio por revisada la lista de un colegio. Con `revisada_en` forma la puerta
que decide si el catalogo puede salir a una tienda: una version sin revisar la
abre, una revisada la cierra para siempre. De ahi que interese quien firmo, y no
solo cuando: el alta de productos que salio de esa revision es suya.
"""

[[referencias_cruzadas]]
desde = "catalogo.propuesta_producto.resuelta_por"
hacia = "identidad.usuario"
nota = """
Quien aprobo o rechazo el candidato. Una busqueda por texto trae productos
reales que no son lo pedido (pedir `punzon punta metalica` devuelve correctores
de punta fina), asi que nada entra al catalogo sin que una persona responda por
el. Sin esta columna, la cola de revision aparentaria un control sin dueño.
"""

[[referencias_cruzadas]]
desde = "catalogo.version_lista_oficial.publicada_por"
hacia = "identidad.usuario"
nota = "Quien del colegio publico esa version de la lista."

[[referencias_cruzadas]]
desde = "catalogo.version_vigente.colegio_id"
hacia = "identidad.colegio"
nota = "Que edicion usa hoy ese colegio para un area, un grado y un anio."

[[referencias_cruzadas]]
desde = "catalogo.propuesta_version.colegio_id"
hacia = "identidad.colegio"
nota = "A quien le llega la propuesta editorial y de quien es la ventana de decision."

[[referencias_cruzadas]]
desde = "catalogo.propuesta_version.resuelta_por"
hacia = "identidad.usuario"
nota = "Nulo solo si la propuesta se vencio, que es el unico desenlace sin persona detras."

