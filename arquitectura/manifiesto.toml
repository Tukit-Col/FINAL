[servicios.ingesta]
lenguaje = "python"
ruta = "servicios/ingesta"
paquete = "tukit_ingesta"
base_datos = ""
descripcion = """
Scrapers y refresco de precios. No tiene base propia: publica hacia Catalogo.
Es el unico componente con argumento tecnico para Go, pero el perfilado mostro
que sus cuellos de hoy son estructurales y no de lenguaje (vendedores en serie,
1,5 s de espera deliberada por producto, sin pool de conexiones). Se arregla eso
en Python primero. Ver Arquitectura/PERFILADO_PIPELINE.md seccion 9.
"""
tablas = []

[servicios.gateway]
lenguaje = "python"
ruta = "servicios/gateway"
paquete = "tukit_gateway"
base_datos = ""
descripcion = """
Ruteo, validacion de token, version de permisos y limite de tasa. Sin dominio y
sin base. Candidato a Go de prioridad baja: no aparece en ninguna medicion como
cuello de botella.
"""
tablas = []


# Referencias entre bases distintas. Como no pueden ser llaves foraneas fisicas,
# la unica forma de que no se vuelvan invisibles es declararlas. Toda referencia
# a un dominio ajeno que NO este aqui hace fallar la prueba.
#
# El diccionario de datos contabiliza 53. Se van declarando a medida que cada
# tabla se implementa; la prueba solo exige que lo implementado este declarado.
[[referencias_cruzadas]]
desde = "inteligencia.item_crudo.matricula_id"
hacia = "identidad.matricula"
nota = "Ancla de tenencia. Se valida contra Identidad al crear, no por llave foranea."

[[referencias_cruzadas]]
desde = "inteligencia.candidato_item.producto_canonico_id"
hacia = "catalogo.producto_canonico"
nota = "El catalogo vive en otra base; la referencia es logica."

[[referencias_cruzadas]]
desde = "inteligencia.linea_kit.producto_canonico_id"
hacia = "catalogo.producto_canonico"
nota = "Reemplaza el JSON `kits_optimizados.items`, que escondia esta misma referencia."

[[referencias_cruzadas]]
desde = "comercio.linea_pedido.matricula_id"
hacia = "identidad.matricula"
nota = "Va en la linea y no en el pedido: dos hermanos deben caber en un solo pago."

[[referencias_cruzadas]]
desde = "comercio.linea_pedido.producto_canonico_id"
hacia = "catalogo.producto_canonico"
nota = "El precio se congela en la linea al confirmar; no se vuelve a leer de Catalogo."

[[referencias_cruzadas]]
desde = "comercio.inventario.producto_canonico_id"
hacia = "catalogo.producto_canonico"
nota = "El stock es de Comercio; el producto es de Catalogo. Esta separacion es la que hoy no existe."

[[referencias_cruzadas]]
desde = "catalogo.lista_oficial.sede_id"
hacia = "identidad.sede"
nota = "La lista la publica un colegio, que vive en Identidad."

[[referencias_cruzadas]]
desde = "operacion.registro_auditoria.actor_id"
hacia = "identidad.usuario"
nota = "Auditoria referencia al actor sin poder bloquearlo ni borrarlo en cascada."
