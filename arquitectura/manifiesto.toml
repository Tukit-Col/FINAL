# --- Catalogo ---

[[referencias_cruzadas]]
desde = "catalogo.producto_canonico.curado_por"
hacia = "identidad.usuario"
nota = "Un producto que nadie curo no existe, asi que no admite nulo pese a cruzar."

[[referencias_cruzadas]]
desde = "catalogo.sustituibilidad_concepto.curado_por"
hacia = "identidad.usuario"
nota = """
Quien declaro que un concepto sirve en lugar de otro. La relacion es curada y
no inducida, asi que saber quien la puso es lo que la distingue de un coseno
entre embeddings. No admite nulo, por la misma regla que
`producto_canonico.curado_por`. Los dos extremos de la arista SI son llaves
foraneas fisicas: ambos conceptos viven en esta misma base.
"""

[[referencias_cruzadas]]
desde = "catalogo.lista_oficial.colegio_id"
hacia = "identidad.colegio"
nota = "La lista oficial es vocabulario de catalogo; la tenencia del colegio vive en Identidad."

[[referencias_cruzadas]]
desde = "catalogo.version_lista_oficial.revisada_por"
hacia = "identidad.usuario"
nota = """
Quien dio por revisada la lista de un colegio. Con `revisada_en` forma la puerta
que decide si el catalogo puede salir a una tienda: una version sin revisar la
abre, una revisada la cierra para siempre. De ahi que interese quien firmo, y no
solo cuando: el alta de productos que salio de esa revision es suya.
"""

[[referencias_cruzadas]]
desde = "catalogo.propuesta_producto.resuelta_por"
hacia = "identidad.usuario"
nota = """
Quien aprobo o rechazo el candidato. Una busqueda por texto trae productos
reales que no son lo pedido (pedir `punzon punta metalica` devuelve correctores
de punta fina), asi que nada entra al catalogo sin que una persona responda por
el. Sin esta columna, la cola de revision aparentaria un control sin dueño.
"""

[[referencias_cruzadas]]
desde = "catalogo.version_lista_oficial.publicada_por"
hacia = "identidad.usuario"
nota = "Quien del colegio publico esa version de la lista."

