# Manifiesto de arquitectura de Tukit
#
# Fuente de verdad de las fronteras del sistema. No es documentacion: las
# pruebas de `arquitectura/test_fronteras.py` lo leen y fallan la integracion
# continua cuando el codigo se sale de lo declarado aqui.
#
# Existe porque el defecto mas grave que encontro el rediseno, dos servicios
# declarando el maestro del mismo catalogo, no se produjo por falta de criterio
# sino porque nada verificaba el criterio de forma continua. Ver ADR 0014.
#
# Derivado de Arquitectura/ESQUEMA_OBJETIVO.md (reparto de las 67 tablas) y de
# Arquitectura/DICCIONARIO_DATOS.md (nombres definitivos).

[meta]
version = "3"
# 67 del esquema objetivo + `direccion` + `sustituibilidad_concepto`.
#
# `direccion`: el esquema objetivo no modelaba ninguna direccion de entrega en
# un negocio que entrega a domicilio; el hueco se cierra con una tabla en
# Identidad mas una copia congelada en el envio de Comercio, que no agrega
# tabla. Ver ADR 0015.
#
# `sustituibilidad_concepto`: que ofrecer cuando el catalogo no tiene lo que la
# lista pide. Hoy 102 de las 297 celdas (concepto x nivel) estan vacias y 17
# conceptos no tienen ni un producto, asi que responder "no lo tengo" sin
# alternativa es la respuesta mas comun y la menos util. La relacion es curada
# sobre 99 conceptos, no inducida, y vive en Catalogo porque es vocabulario de
# catalogo. Reemplaza al grafo en memoria que se reconstruia por item y costaba
# el 95,3 por ciento de la latencia del pipeline.
total_tablas_esperado = 70

# Tablas que existen a proposito en varias bases. Son la excepcion declarada,
# no un descuido: cada servicio necesita su propia bandeja de salida local para
# que el evento se escriba en la MISMA transaccion que el cambio que lo origina.
# Si no fuera local, volveria a ser una escritura a dos sistemas sin garantia.
tablas_replicadas = ["bandeja_salida"]


[servicios.identidad]
lenguaje = "python"
ruta = "servicios/identidad"
paquete = "tukit_identidad"
base_datos = "tukit_identidad"
descripcion = "Personas, tenencia y autorizacion. Frontera de cumplimiento: aqui viven los datos de menores."
tablas = [
    "usuario",
    "perfil_socioeconomico",
    "consentimiento",
    "consentimiento_finalidad",
    "solicitud_supresion",
    "colegio",
    "sede",
    "rol",
    "permiso",
    "rol_permiso",
    "asignacion_rol",
    "estudiante",
    "matricula",
    "acudiente_matricula",
    "direccion",
    "bandeja_salida",
]

[servicios.catalogo]
lenguaje = "python"
ruta = "servicios/catalogo"
paquete = "tukit_catalogo"
base_datos = "tukit_catalogo"
descripcion = """
Que existe y a que precio publico. El grueso es reconstruible scrapeando, pero la base pasa a
objetivo de punto de recuperacion CERO: cuatro tablas editoriales guardan decisiones
institucionales nominales que no se reconstruyen, y la recuperacion es por agrupacion de bases,
no por tabla. Ver ADR 0017. Se separa de Comercio por perfil de recurso (pgvector, replicas de
lectura, rafagas del scraper), no ya por recuperabilidad asimetrica.
"""
tablas = [
    "concepto",
    "concepto_ruta_categoria",
    "sustituibilidad_concepto",
    "grupo_variante",
    "producto_canonico",
    "tienda",
    "oferta_tienda",
    "precio_oferta",
    "corrida_scraper",
    "lista_oficial",
    "version_lista_oficial",
    "item_lista_oficial",
    "tarea_importacion",
    "edicion_libro",
    "version_vigente",
    "propuesta_version",
    "propuesta_producto",
    "configuracion_colegio_editorial",
    "bandeja_salida",
]

[servicios.inteligencia]
lenguaje = "python"
ruta = "servicios/inteligencia"
paquete = "tukit_inteligencia"
base_datos = "tukit_inteligencia"
descripcion = """
Percepcion, normalizacion, resolucion y optimizacion. Perfil de recurso propio:
CPU intensivo y modelos.

CUIDADO AL PORTAR, dos cosas que el servicio anterior hacia mal:

(1) `kit.perfil` y `kit.pesos_usados` son derivados de la encuesta
socioeconomica, que en Identidad esta cifrada. Aqui vivian EN CLARO. Cifrar el
origen y dejar el derivado en claro no protege nada. Peor: el proceso de
derecho al olvido documentaba la decision de NO borrar el kit argumentando que
'no tiene ninguna columna con datos personales', lo cual es cierto para las
columnas que su autor tenia en mente y falso para esas dos.

(2) El grafo de sustituibilidad se reconstruia entero en cada item, y eso solo
era el 95,3 por ciento de la latencia del pipeline: 1.673 ms construirlo contra
0,137 ms consultarlo. Va cacheado por (categoria, version del catalogo) y fuera
del bucle de eventos. Ver Arquitectura/PERFILADO_PIPELINE.md.
"""
tablas = [
    "item_crudo",
    "candidato_item",
    "resolucion_item",
    "transicion_resolucion",
    "kit",
    "linea_kit",
    "trabajo_pipeline",
    "etapa_trabajo",
    "bandeja_salida",
]

