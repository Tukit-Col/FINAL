hacia = "catalogo.producto_canonico"
nota = "Reemplaza el JSON `kits_optimizados.items`, que escondia esta misma referencia."

[[referencias_cruzadas]]
desde = "inteligencia.resolucion_item.decidido_por"
hacia = "identidad.usuario"
nota = """
Quien de Admin Tukit valido el emparejamiento o lo marco sin coincidencia
(AD-04). Nulo mientras la decision sea automatica, y esa distincion es el
punto entero de la columna: un kit revisado por una persona y uno que salio
solo del umbral no son la misma promesa, y hoy no habia como diferenciarlos.
"""

[[referencias_cruzadas]]
desde = "inteligencia.transicion_resolucion.decidida_por"
hacia = "identidad.usuario"
