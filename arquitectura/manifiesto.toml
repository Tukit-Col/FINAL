# Manifiesto de arquitectura de Tukit
#
# Fuente de verdad de las fronteras del sistema. Las pruebas de
# `arquitectura/test_fronteras.py` lo leen y fallan la integracion continua
# cuando el codigo se sale de lo declarado aqui.
#
# Decisiones:
# - Cada servicio es dueno de sus tablas y de su base. Una referencia a otro
#   dominio es logica, no una llave foranea, y se declara en `referencias_cruzadas`.
# - `bandeja_salida` existe en cada base a proposito: el evento se escribe en la
#   misma transaccion que el cambio que lo origina.

[meta]
version = "3"
total_tablas_esperado = 76
tablas_replicadas = ["bandeja_salida"]


[servicios.identidad]
ruta = "servicios/identidad"
paquete = "tukit_identidad"
base_datos = "tukit_identidad"
descripcion = "Personas, tenencia y autorizacion. Frontera de cumplimiento: aqui viven los datos de menores."
tablas = [
    "usuario",
    "perfil_socioeconomico",
    "consentimiento",
    "consentimiento_finalidad",
    "solicitud_supresion",
    "colegio",
    "sede",
    "rol",
    "permiso",
    "rol_permiso",
    "asignacion_rol",
    "estudiante",
    "matricula",
    "acudiente_matricula",
    "direccion",
    "bandeja_salida",
]

[servicios.catalogo]
ruta = "servicios/catalogo"
paquete = "tukit_catalogo"
base_datos = "tukit_catalogo"
descripcion = """
Que existe y a que precio publico. La base es de punto de recuperacion cero: cuatro tablas
editoriales guardan decisiones institucionales nominales que no se reconstruyen, y la
recuperacion es por agrupacion de bases, no por tabla. Se separa de Comercio por perfil de
recurso (pgvector, replicas de lectura, rafagas del scraper).
"""
tablas = [
    "concepto",
    "concepto_ruta_categoria",
    "sustituibilidad_concepto",
    "grupo_variante",
    "producto_canonico",
    "tienda",
    "oferta_tienda",
    "precio_oferta",
    "corrida_scraper",
    "lista_oficial",
    "version_lista_oficial",
    "correccion_lista",
    "item_lista_oficial",
    "tarea_importacion",
    "edicion_libro",
    "version_vigente",
    "propuesta_version",
    "propuesta_producto",
    "configuracion_colegio_editorial",
    "bandeja_salida",
]

[servicios.inteligencia]
ruta = "servicios/inteligencia"
paquete = "tukit_inteligencia"
base_datos = "tukit_inteligencia"
descripcion = """
Percepcion, normalizacion, resolucion y optimizacion. Perfil de recurso propio: CPU intensivo y
modelos.

Decisiones:
- `kit.perfil` y `kit.pesos_usados` derivan de la encuesta socioeconomica, que en Identidad esta
  cifrada. Cifrar el origen y dejar el derivado en claro no protege nada, asi que ambas columnas
  son dato personal y la supresion del titular las alcanza.
- El grafo de sustituibilidad no se reconstruye por item: va cacheado por (categoria, version del
  catalogo) y fuera del bucle de eventos.
"""
tablas = [
    "item_crudo",
    "candidato_item",
    "resolucion_item",
    "transicion_resolucion",
    "kit",
    "linea_kit",
    "trabajo_pipeline",
    "etapa_trabajo",
    "bandeja_salida",
    "kit_canonico",
    "importacion_lista",
    "evento_procesado",
    "apodo_subida",
]

[servicios.comercio]
ruta = "servicios/comercio"
paquete = "tukit_comercio"
base_datos = "tukit_comercio"
descripcion = "Pedidos, inventario, pagos y entrega. Irremplazable: objetivo de punto de recuperacion cero."
tablas = [
    "pedido",
    "linea_pedido",
    "historial_pedido",
    "devolucion",
    "zona_entrega",
    "ruta_reparto",
    "envio",
