    "inventario_proveedor",
    "pedido_mayorista",
    "item_pedido_mayorista",
    "bandeja_salida",
]

[servicios.operacion]
ruta = "servicios/operacion"
paquete = "tukit_operacion"
base_datos = "tukit_operacion"
descripcion = "Casos, PQRS, notificaciones, auditoria y telemetria. Solo anexar, crece sin limite."
tablas = [
    "caso",
    "evento_caso",
    "alarma",
    "notificacion",
    "preferencia_notificacion",
    "evento_clickout",
    "registro_auditoria",
