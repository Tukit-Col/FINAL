name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Trabajo aparte y primero, no un paso mas dentro de las pruebas. Si una
  # frontera se rompio, el diagnostico tiene que ser inmediato y legible, sin
  # quedar sepultado entre cientos de pruebas de dominio.
  fronteras:
    name: Fronteras de arquitectura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv venv --python 3.12
      - run: uv pip install pytest pytest-asyncio
      - name: Verificar fronteras
        run: .venv/bin/pytest arquitectura/ -v

  lint:
    name: Estilo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv venv --python 3.12
      - run: uv pip install ruff
      - run: .venv/bin/ruff check .
      - run: .venv/bin/ruff format --check .

  # Ejecucion selectiva por ruta: con siete servicios, correr todo en cada
  # commit es la objecion real al monorepo, y esto es lo que la responde.
  pruebas:
    name: Pruebas
    needs: fronteras
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        servicio: [identidad, catalogo, inteligencia, comercio, operacion, ingesta, gateway]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Los valores de `github.*` se pasan por `env` y nunca se interpolan
      # dentro del script: interpolar directo en `run:` es como se inyectan
      # comandos en un flujo de trabajo.
      - name: Detectar si el servicio cambio
        id: cambios
        env:
          SHA_BASE: ${{ github.event.pull_request.base.sha }}
          SERVICIO: ${{ matrix.servicio }}
        run: |
          set -euo pipefail
          base="${SHA_BASE:-HEAD~1}"
          if git diff --quiet "$base" HEAD -- \
               "servicios/${SERVICIO}" libs/ pyproject.toml; then
            echo "correr=no" >> "$GITHUB_OUTPUT"
          else
            echo "correr=si" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@v5
        if: steps.cambios.outputs.correr == 'si'
        with:
          enable-cache: true

      - name: Pruebas del servicio
        if: steps.cambios.outputs.correr == 'si'
        env:
          SERVICIO: ${{ matrix.servicio }}
        run: |
          set -euo pipefail
          if [ -d "servicios/${SERVICIO}/tests" ]; then
            uv venv --python 3.12
            # Las dependencias van explicitas y no `uv sync` porque este
            # trabajo corre por servicio y sincronizar el espacio de trabajo
            # entero anularia el ahorro que justifica la ejecucion selectiva.
            #
            # `aiosqlite` no es opcional aunque lo parezca: las pruebas de
            # dominio corren contra SQLite en memoria, y sin el driver async
            # el fallo sale en la fixture y no en el caso, asi que no se
            # parece en nada a lo que de verdad se rompio.
            #
            # `tenacity` la importa `tukit_comun.resiliencia`, que comercio e
            # inteligencia cargan al importar sus clientes remotos; sin ella
            # esas dos pruebas caen en la recoleccion.
            #
            # `uvicorn` la importan las pruebas de arranque de cada `api.py`
            # (sustituyen `uvicorn.run` para no abrir puertos); sin ella el
            # modulo de prueba entero cae en la recoleccion.
            uv pip install pytest pytest-asyncio \
              sqlalchemy pydantic pgvector aiosqlite \
              fastapi httpx alembic greenlet tenacity uvicorn \
              numpy pymoo
            .venv/bin/pytest "servicios/${SERVICIO}" -q
          else
            echo "Sin pruebas todavia en ${SERVICIO}."
          fi

  # Las migraciones necesitan un motor de verdad, asi que este trabajo no puede
  # ser un paso mas dentro de `pruebas`: las de dominio corren contra SQLite.
  #
  # Y tiene que correr en cada propuesta de cambio, porque comprueba algo que
  # ninguna prueba sin motor puede ver: que el esquema que dejan las
  # migraciones sea el que declaran los modelos. El fallo tipico es que el
  # modelo declare una restriccion, la migracion no la cree, y todo siga verde.
  # Paso de verdad con una llave foranea entre `grupo_variante` y
  # `producto_canonico`, que la migracion no creaba.
  #
  # Misma imagen que el compose de `infra/`: pgvector sobre Postgres 16. Con
  # `postgres:16` a secas, `CREATE EXTENSION vector` falla.
  migraciones:
    name: Migraciones y deriva de esquema
    needs: fronteras
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tukit
          POSTGRES_PASSWORD: tukit
          POSTGRES_DB: tukit_identidad
        ports:
          - 5432:5432
        # Sin esto los pasos arrancan antes de que el motor acepte conexiones,
        # y el fallo aparece como un rechazo de conexion que parece de red.
        options: >-
          --health-cmd "pg_isready -U tukit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Aqui el motor esta en un contenedor aparte y solo se llega por TCP, asi
      # que se define el host para que el Makefile no use el socket local.
      TUKIT_DB_HOST: localhost
      TUKIT_DB_PORT: "5432"
      # El cliente intenta GSSAPI antes que la contrasena. Sin Kerberos
      # configurado eso no siempre falla rapido; deshabilitarlo evita quedarse
      # esperando el tiempo de espera.
      PGGSSENCMODE: disable

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv venv --python 3.12
      # `greenlet` no es opcional: sin ella, el `run_sync` de SQLAlchemy async
      # que usan las migraciones cae con `No module named 'greenlet'`.
      - run: uv pip install alembic asyncpg sqlalchemy pgvector pydantic greenlet

      - name: Instalar el cliente de Postgres
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Crear las bases que faltan
        env:
          PGPASSWORD: tukit
        run: |
          set -euo pipefail
          # La imagen crea una sola base, la de POSTGRES_DB. Las demas van aqui.
          for base in catalogo inteligencia comercio operacion; do
            psql -w -h localhost -U tukit -d postgres -c "CREATE DATABASE tukit_${base}"
          done

      - name: Aplicar las migraciones
        run: make bd-migrar

      - name: Comprobar extensiones e indices
        run: make bd-verificar

      - name: Comprobar que no haya deriva entre modelos y migraciones
        run: make bd-deriva

      - name: Comprobar que las migraciones se puedan revertir
        run: |
          set -euo pipefail
          # Una migracion que no se puede deshacer no sirve para produccion, y
          # eso solo se sabe intentandolo. Vuelve a subir para dejar el motor
          # como estaba, por si algun paso posterior lo necesita.
          for servicio in identidad catalogo inteligencia; do
            ( cd "servicios/${servicio}" \
              && PYTHONPATH=".:../../libs/py/tukit_comun" ../../.venv/bin/alembic downgrade base \
              && PYTHONPATH=".:../../libs/py/tukit_comun" ../../.venv/bin/alembic upgrade head )
          done

  # Gate de cobertura (NFR-MAN-01 de la matriz de QA). Es el unico trabajo que
  # corre la suite entera, `libs/` incluida, y sin ejecucion selectiva: una
  # cifra de cobertura sobre lo que cambio no dice nada del total.
  #
  # Aqui si se sincroniza el espacio de trabajo con el extra `dev`, que es donde
  # cada servicio declara `aiosqlite`. Con la lista explicita de `pruebas`, o
  # sin el extra, un tercio de la suite cae en la fixture y la cifra mide el
  # entorno, no las pruebas. `pytest-cov` va fijado a la version con que se
  # midio la linea base, para que las dos cifras se puedan comparar.
  #
  # Las exclusiones viven en `.coveragerc`. El umbral es el 50 % global; la
  # referencia del mismo entorno es el 71,22 % de la linea base.
  cobertura:
    name: Cobertura
    needs: fronteras
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-packages --extra dev --frozen --python 3.12
      - run: uv pip install pytest-cov==7.1.0
      - name: Medir cobertura con umbral
        run: >-
          .venv/bin/pytest arquitectura libs servicios -q
          --cov=. --cov-config=.coveragerc
          --cov-report=term-missing:skip-covered
          --cov-fail-under=50
