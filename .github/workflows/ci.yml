name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Trabajo aparte y primero, no un paso mas dentro de las pruebas. Si una
  # frontera se rompio, el diagnostico tiene que ser inmediato y legible, sin
  # quedar sepultado entre cientos de pruebas de dominio.
  fronteras:
    name: Fronteras de arquitectura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv venv --python 3.12
      - run: uv pip install pytest pytest-asyncio==1.4.0
      - name: Verificar fronteras
        run: .venv/bin/pytest arquitectura/ -v

  lint:
    name: Estilo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv venv --python 3.12
      - run: uv pip install ruff==0.16.8
      - run: .venv/bin/ruff check .
      - run: .venv/bin/ruff format --check .

  # Ejecucion selectiva por ruta: con seis servicios, correr todo en cada
  # commit es la objecion real al monorepo, y esto es lo que la responde.
  pruebas:
    name: Pruebas
    needs: fronteras
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        servicio: [identidad, catalogo, inteligencia, comercio, operacion, gateway]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Los valores de `github.*` se pasan por `env` y nunca se interpolan
      # dentro del script: interpolar directo en `run:` es como se inyectan
      # comandos en un flujo de trabajo.
      - name: Detectar si el servicio cambio
        id: cambios
        env:
          SHA_BASE: ${{ github.event.pull_request.base.sha }}
          SERVICIO: ${{ matrix.servicio }}
        run: |
          set -euo pipefail
          base="${SHA_BASE:-HEAD~1}"
          if git diff --quiet "$base" HEAD -- \
               "servicios/${SERVICIO}" libs/ pyproject.toml; then
            echo "correr=no" >> "$GITHUB_OUTPUT"
          else
            echo "correr=si" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@v7
        if: steps.cambios.outputs.correr == 'si'
        with:
          enable-cache: true

      - name: Pruebas del servicio
        if: steps.cambios.outputs.correr == 'si'
        env:
          SERVICIO: ${{ matrix.servicio }}
        run: |
          set -euo pipefail
          if [ -d "servicios/${SERVICIO}/tests" ]; then
            uv venv --python 3.12
            # Las dependencias van explicitas y no `uv sync` porque este
            # trabajo corre por servicio y sincronizar el espacio de trabajo
            # entero anularia el ahorro que justifica la ejecucion selectiva.
            #
            # `aiosqlite` no es opcional aunque lo parezca: las pruebas de
            # dominio corren contra SQLite en memoria, y sin el driver async
            # el fallo sale en la fixture y no en el caso, asi que no se
            # parece en nada a lo que de verdad se rompio.
            uv pip install pytest pytest-asyncio==1.4.0 \
              sqlalchemy pydantic pgvector aiosqlite cryptography \
              fastapi httpx alembic greenlet \
              numpy pymoo tenacity
            .venv/bin/pytest "servicios/${SERVICIO}" -q
          else
            echo "Sin pruebas todavia en ${SERVICIO}."
          fi

  # Los ensayos no son un servicio, pero sus pruebas fijan cosas que la tesis
  # cita: el optimo exacto contra el que se midio el NSGA-II, y el parseo y
  # emparejamiento de punta a punta. Sin este trabajo nadie las corria, y se
  # podian romper sin que nada se pusiera rojo. Son segundos, asi que corren
  # siempre y no por ruta.
  ensayos:
    name: Pruebas de los ensayos
    needs: fronteras
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv venv --python 3.12
      - run: |
          uv pip install pytest pytest-asyncio==1.4.0 \
            sqlalchemy pydantic pgvector aiosqlite cryptography \
            fastapi httpx alembic greenlet \
            numpy pymoo
      - name: Pruebas de los ensayos
        run: .venv/bin/pytest ensayos -q

  # Las migraciones necesitan un motor de verdad, asi que este trabajo no puede
  # ser un paso mas dentro de `pruebas`: las de dominio corren contra SQLite.
  #
  # Y tiene que correr en cada propuesta de cambio, porque comprueba algo que
  # ninguna prueba sin motor puede ver: que el esquema que dejan las
  # migraciones sea el que declaran los modelos. El fallo tipico es que el
  # modelo declare una restriccion, la migracion no la cree, y todo siga verde.
  # Paso de verdad con una llave foranea entre `grupo_variante` y
  # `producto_canonico`, que la migracion no creaba.
  #
  # Misma imagen que el compose de `infra/`: pgvector sobre Postgres 16. Con
  # `postgres:16` a secas, `CREATE EXTENSION vector` falla.
  migraciones:
    name: Migraciones y deriva de esquema
    needs: fronteras
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tukit
          POSTGRES_PASSWORD: tukit
          POSTGRES_DB: tukit_identidad
        ports:
          - 5432:5432
        # Sin esto los pasos arrancan antes de que el motor acepte conexiones,
        # y el fallo aparece como un rechazo de conexion que parece de red.
        options: >-
          --health-cmd "pg_isready -U tukit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Aqui el motor esta en un contenedor aparte y solo se llega por TCP, asi
      # que se define el host para que el Makefile no use el socket local.
      TUKIT_DB_HOST: localhost
      TUKIT_DB_PORT: "5432"
      # El cliente intenta GSSAPI antes que la contrasena. Sin Kerberos
      # configurado eso no siempre falla rapido; deshabilitarlo evita quedarse
      # esperando el tiempo de espera.
      PGGSSENCMODE: disable

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv venv --python 3.12
      - run: uv pip install alembic asyncpg sqlalchemy pgvector pydantic greenlet

      - name: Instalar el cliente de Postgres
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Crear las bases que faltan
        env:
          PGPASSWORD: tukit
        run: |
          set -euo pipefail
          # La imagen crea una sola base, la de POSTGRES_DB. Las demas van aqui.
          for base in catalogo inteligencia comercio operacion; do
            psql -w -h localhost -U tukit -d postgres -c "CREATE DATABASE tukit_${base}"
          done

      - name: Aplicar las migraciones
        run: make bd-migrar

      - name: Comprobar extensiones e indices
        run: make bd-verificar

      - name: Comprobar que no haya deriva entre modelos y migraciones
        run: make bd-deriva

      - name: Comprobar que las migraciones se puedan revertir
        run: |
          set -euo pipefail
          # Una migracion que no se puede deshacer no sirve para produccion, y
          # eso solo se sabe intentandolo. Vuelve a subir para dejar el motor
          # como estaba, por si algun paso posterior lo necesita.
          for servicio in identidad catalogo inteligencia; do
            ( cd "servicios/${servicio}" \
              && PYTHONPATH=".:../../libs/py/tukit_comun" ../../.venv/bin/alembic downgrade base \
              && PYTHONPATH=".:../../libs/py/tukit_comun" ../../.venv/bin/alembic upgrade head )
          done

  # Las pruebas de las colas (marcador `rabbitmq`) necesitan un broker
  # de verdad, asi que van en un trabajo aparte, como las migraciones necesitan
  # un Postgres. La imagen es la del banco de QA y la del compose de `infra/`.
  #
  # Sin broker, esas pruebas se saltan, y en CI eso seria un verde mentiroso:
  # `TUKIT_PRUEBAS_RABBITMQ_OBLIGATORIO` hace que fallen, y el paso anterior a
  # las pruebas dice si el broker respondio.
  colas:
    name: Colas contra RabbitMQ
    needs: fronteras
    runs-on: ubuntu-latest

    services:
      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        ports:
          - 5672:5672
        # Sin esto los pasos arrancan antes de que el broker acepte conexiones.
        # `rabbitmq-diagnostics` arranca una VM de Erlang en cada llamada, asi
        # que el tiempo de espera es mas holgado que el de Postgres.
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 15s
          --health-retries 20

    env:
      TUKIT_PRUEBAS_RABBITMQ_URL: amqp://guest:guest@localhost:5672/
      TUKIT_PRUEBAS_RABBITMQ_OBLIGATORIO: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv venv --python 3.12
      # Las de `pruebas` mas `aio-pika`. Se recogen todas las pruebas para
      # elegir las marcadas, y recoger una prueba importa su modulo.
      - run: |
          uv pip install pytest pytest-asyncio==1.4.0 \
            sqlalchemy pydantic pgvector aiosqlite cryptography \
            fastapi httpx alembic greenlet \
            numpy pymoo tenacity aio-pika

      - name: Comprobar que el broker responde
        env:
          RABBITMQ_URL: amqp://guest:guest@localhost:5672/
          PYTHONPATH: libs/py/tukit_comun
        run: .venv/bin/python -m tukit_comun.broker

      - name: Pruebas de las colas
        run: .venv/bin/pytest libs servicios ensayos -q -m rabbitmq -rs

  # La cache y el limite de tasa contra un Redis de verdad, como
  # `colas` con RabbitMQ: las pruebas con el marcador `redis` aqui son
  # obligatorias, asi que un Redis que no responde pone el trabajo en rojo en
  # vez de saltarlas. Corre tambien las pruebas unitarias del cliente comun,
  # que `pruebas` no corre porque va por servicio.
  redis:
    name: Cache y limite contra Redis
    needs: fronteras
    runs-on: ubuntu-latest

    services:
      redis:
        # La misma imagen que el compose de `infra/`.
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # La base 15, nunca la 0: las pruebas borran lo suyo al terminar.
      TUKIT_PRUEBAS_REDIS_URL: redis://localhost:6379/15
      TUKIT_PRUEBAS_REDIS_OBLIGATORIO: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv venv --python 3.12
      # Las de `colas` mas `redis`, con la version minima de `tukit_comun`. Como
      # alli, se recogen todas las pruebas para elegir las marcadas, y algunas de
      # `libs` importan `aiormq`, que llega con `aio-pika`.
      - run: |
          uv pip install pytest pytest-asyncio==1.4.0 \
            sqlalchemy pydantic pgvector aiosqlite cryptography \
            fastapi httpx alembic greenlet \
            numpy pymoo tenacity aio-pika "redis>=8.1.0"

      - name: Comprobar que Redis responde
        env:
          REDIS_URL: redis://localhost:6379/15
          PYTHONPATH: libs/py/tukit_comun
        run: .venv/bin/python -m tukit_comun.cache

      - name: Pruebas unitarias del cliente comun
        run: .venv/bin/pytest libs/py/tukit_comun/tests/test_cache.py -q

      - name: Pruebas contra Redis
        run: .venv/bin/pytest libs servicios ensayos -q -m redis -rs

  # Los tests de TypeScript (contrato, web y admin) con el runner nativo de Node.
  web:
    name: Web y admin (tipos, estilo y pruebas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
