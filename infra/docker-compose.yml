# Infraestructura local de desarrollo.
#
# Un solo Postgres 16 con la extension pgvector, que hospeda las CINCO bases
# del sistema, y el RabbitMQ por el que viajan los eventos (ADR 0046). Que sean cinco bases logicas en un motor, y no cinco motores, es
# deliberado para el piloto: el aislamiento que exige la arquitectura es de
# ESQUEMA y de conexion (una base, un dueno, ver los cinco invariantes), no de
# proceso. La funcion de aptitud `test_ningun_servicio_nombra_la_base_de_otro`
# sigue siendo la que garantiza que un servicio no cruce a la base de otro, y no
# depende de que esten en motores separados. En produccion se pueden separar sin
# tocar el codigo: cada servicio ya recibe su URL del entorno.
#
# Levantar:   make bd-arriba  (Postgres y RabbitMQ)
# Bajar:      make bd-abajo
# Reiniciar:  make bd-limpiar  (BORRA los datos)
#
# ---------------------------------------------------------------------------
# Los cuatro procesos HTTP viven aqui bajo el perfil `api`, y estan APAGADOS
# por omision. `make bd-arriba` levanta solo Postgres y RabbitMQ.
#
#     docker compose -f infra/docker-compose.yml --profile api up -d
#
# La separacion por perfil no es una mania de organizacion. El camino de
# desarrollo que de verdad se usa es `make arriba`, que corre los cuatro
# procesos contra el arbol de trabajo: recarga al editar, se depura con un
# `breakpoint()` y no exige reconstruir una imagen por cada cambio. Meterlos
# en el `up` por omision obligaria a todo el mundo a pasar por Docker para
# tocar una linea.
#
# ADVERTENCIA HONESTA: el bloque `api` de abajo NO se ha ejecutado. La maquina
# donde se escribio no tiene Docker instalado, asi que esta revisado a ojo y
# nada mas. El resto del archivo (el Postgres) si esta en uso. Es la misma
# clase de deuda que ya documenta el Makefile sobre el SQL de indices, que se
# escribio a ciegas durante dias por no tener motor: anotarla es lo que evita
# que alguien la de por probada.
# ---------------------------------------------------------------------------

services:
  postgres:
    # pgvector/pgvector empaqueta Postgres 16 con la extension ya compilada.
    # El tipo Vector(1024) de catalogo la necesita; sin ella el esquema de
    # catalogo no materializa. La otra mitad de la busqueda hibrida, pg_trgm,
    # viene en contrib y esta en cualquier imagen oficial: no condiciona la
    # eleccion de imagen, solo hay que habilitarla por base.
    image: pgvector/pgvector:pg16
    container_name: tukit_postgres
    environment:
      POSTGRES_USER: tukit
      POSTGRES_PASSWORD: tukit
      # La base que Postgres crea al arrancar. Las cinco del sistema las crea
      # el script de init de abajo; esta es solo la de administracion.
      POSTGRES_DB: tukit
    ports:
      - "5432:5432"
    volumes:
      - tukit_pgdata:/var/lib/postgresql/data
      # El script corre UNA vez, cuando el volumen esta vacio. Crea las cinco
      # bases y habilita sus extensiones (vector, pg_trgm) en cada una. Como no
      # vuelve a correr, agregar una extension aqui no alcanza para quien ya
      # tiene el volumen creado: por eso `make bd-esquema` las vuelve a
      # asegurar de forma idempotente desde la libreria compartida.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tukit"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Los cuatro procesos HTTP, bajo el perfil `api` --------------------
  #
  # Cada uno recibe la URL de SU base por entorno y nunca la escribe en el
  # codigo: es lo que mantiene verde la regla 3. El host es `postgres`, el
  # nombre del servicio de aqui arriba, y no `localhost`.

  identidad: &servicio
    profiles: ["api"]
    build:
      context: ..
      dockerfile: infra/Dockerfile
    environment: &entorno
      TUKIT_DB_HOST: postgres
      TUKIT_DB_PORT: 5432
      TUKIT_DB_USER: tukit
      TUKIT_DB_PASSWORD: tukit
      # Los tres se encuentran por nombre de servicio, no por IP ni por
      # puerto publicado: dentro de la red del compose el 8011 de identidad
      # es el mismo aunque afuera se mapee a otro.
      TUKIT_IDENTIDAD_URL: http://identidad:8011
      TUKIT_CATALOGO_URL: http://catalogo:8012
      TUKIT_INTELIGENCIA_URL: http://inteligencia:8013
      TUKIT_CORS_ORIGENES: "http://localhost:3000,http://127.0.0.1:3000"
      # Con la URL, Inteligencia deja el aviso de cada trabajo en su bandeja
      # para el trabajador (ADR 0046). El broker se encuentra por nombre de
      # servicio, igual que la base.
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "tukit_identidad.api", "--puerto", "8011", "--host", "0.0.0.0"]
    ports: ["8011:8011"]

  catalogo:
    <<: *servicio
    environment: *entorno
    command: ["python", "-m", "tukit_catalogo.api", "--puerto", "8012", "--host", "0.0.0.0"]
    ports: ["8012:8012"]

  inteligencia:
    <<: *servicio
    environment: *entorno
    command: ["python", "-m", "tukit_inteligencia.api", "--puerto", "8013", "--host", "0.0.0.0"]
    ports: ["8013:8013"]

  gateway:
    <<: *servicio
    # La puerta no tiene base ni dominio: solo necesita saber donde estan los
    # otros tres. Depende de ellos para que `docker compose up` no la deje
    # respondiendo 503 durante los primeros segundos.
    depends_on: [identidad, catalogo, inteligencia]
    environment: *entorno
    command: ["python", "-m", "tukit_gateway.api", "--puerto", "8010", "--host", "0.0.0.0"]
    ports: ["8010:8010"]

  # --- El broker de los eventos, sin perfil -------------------------------
  #
  # Encendido por omision, como Postgres: `make bd-arriba` lo levanta y
  # `make arriba` lo comprueba antes de lanzar los procesos con `RABBITMQ_URL`.
  # Cada productor publica su bandeja aqui y cada consumidor escucha su cola
  # (ADR 0046). Si no responde, los procesos sondean las bases como antes: el
  # broker acelera la entrega y quita las lecturas cruzadas, pero no es un
  # requisito para correr.
  #
  # La imagen es la del banco de QA y la de CI, que corre las pruebas de las
  # colas contra ella. El usuario es `guest`, el de `.env.ejemplo`: la imagen
  # oficial lo deja entrar desde fuera del contenedor, que es desde donde se
  # conectan `make arriba` y CI.
  #
  # ADVERTENCIA HONESTA: este servicio NO se ha levantado con Docker en la
  # maquina donde se escribio, que no lo tiene. CI si usa la misma imagen como
  # servicio, asi que la imagen, el usuario y el puerto estan probados ahi.

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: tukit_rabbitmq
    # 5672 = protocolo AMQP (lo usa `aio-pika`); 15672 = consola de gestion.
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - tukit_rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Backbone opcional: trazas y cache, bajo el perfil `infra` ---------
  #
  # APAGADOS por omision, igual que el perfil `api`; `make infra-arriba` los
  # levanta.
  #
  #     docker compose -f infra/docker-compose.yml --profile infra up -d
  #
  # El codigo degrada honestamente sin este bloque (patron WOMPI_MODO=falso):
  # sin `OTEL_EXPORTER_OTLP_ENDPOINT` la instrumentacion es no-op y sin
  # `REDIS_URL` el breaker vive en memoria. Levantar esto es un upgrade de
  # observabilidad, no un requisito para correr.
  #
  # ADVERTENCIA HONESTA: como el bloque `api`, este bloque NO se ha ejecutado.
  # La maquina donde se escribio no tiene Docker; esta revisado a ojo. Misma
  # clase de deuda que ya documentan el Makefile y el perfil `api`: anotarla es
  # lo que evita darla por probada.

  redis:
    profiles: ["infra"]
    # Backend intercambiable del circuit breaker (hoy in-memory) y, mas
    # adelante, adaptador de socket.io para la colaboracion admin (B.5).
    image: redis:7
    container_name: tukit_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  jaeger:
    profiles: ["infra"]
    # Recibe las trazas OTLP y las muestra. UI en :16686. `all-in-one` trae
    # collector + almacen + UI en un contenedor, suficiente para el piloto.
    image: jaegertracing/all-in-one:1.60
    container_name: tukit_jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # UI
      - "4317:4317"    # OTLP gRPC  (OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4317)
      - "4318:4318"    # OTLP HTTP

volumes:
  tukit_pgdata:
  tukit_rabbitmq:
