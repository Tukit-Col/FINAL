[project]
name = "tukit-comun"
version = "0.1.0"
description = "Libreria compartida del monorepo: acceso a base de datos, configuracion y utilidades transversales. No es un servicio ni tiene dominio."
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "tenacity>=9.1.4",
    "aio-pika>=9.5.0",
    "redis>=8.1.0",
]

[project.optional-dependencies]
# El driver async de Postgres. Es opcional a proposito: las pruebas de dominio
# corren contra SQLite en memoria (aiosqlite) y no necesitan Postgres, asi que
# la integracion continua no obliga a instalar asyncpg. El servicio que se
# conecta a una base real lo instala con `pip install tukit-comun[postgres]`.
postgres = ["asyncpg>=0.29"]

# Alembic, por la misma razon. `tukit_comun.migraciones` es el arranque
# compartido del entorno de migraciones, y solo lo importa el `env.py` de un
# servicio: nada del camino normal de la aplicacion pasa por ahi. Quien genera
# o aplica migraciones instala `tukit-comun[migraciones,postgres]`; los dos
# extras van juntos porque una migracion sin driver no se puede aplicar.
migraciones = ["alembic>=1.13"]

# OpenTelemetry (ADR 0021). Opcional a proposito: sin `OTEL_EXPORTER_OTLP_ENDPOINT`
# la instrumentacion es no-op TOTAL (ni siquiera importa esto), asi que la tesis
# corre sin collector y la CI no lo instala. Quien quiera trazas contra Jaeger
# instala `tukit-comun[otel]` y levanta la infra (`make infra-arriba`).
otel = [
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tukit_comun"]
